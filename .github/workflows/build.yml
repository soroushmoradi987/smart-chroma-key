name: Build Smart Chroma Key

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset macos

      - name: Build
        run: cmake --build build_macos --config Release

      - name: Package
        run: |
          cmake --install build_macos --config Release --prefix "$GITHUB_WORKSPACE/release/Release"
          CI=1 .github/scripts/package-macos --config Release --package
          ditto -c -k --sequesterRsrc --keepParent \
            release/Release/smart-chroma-key.plugin \
            smart-chroma-key-macos.zip

      - name: Verify macOS Installer
        run: |
          installer="$(find release -maxdepth 1 -name 'smart-chroma-key-*-macos-universal.pkg' -print -quit)"
          test -s "$installer"
          pkgutil --payload-files "$installer" | grep -F 'smart-chroma-key.plugin/Contents/MacOS/smart-chroma-key'
          pkgutil --payload-files "$installer" | grep -F 'smart-chroma-key.effect'
          if pkgutil --payload-files "$installer" | grep -E '/\._|/\.DS_Store|\.dSYM'; then
            echo 'Unexpected metadata or debug symbols in macOS installer' >&2
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-chroma-key-macos
          path: |
            smart-chroma-key-macos.zip
            release/smart-chroma-key-*-macos-universal.pkg

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build And Package (ZIP + EXE)
        shell: pwsh
        run: |
          .github/scripts/Build-Installer-Windows.ps1 -Target x64 -Configuration Release -InstallDependencies

      - name: Smoke Test Windows Installer
        shell: pwsh
        run: |
          $Installer = Get-Item release/*-installer.exe | Select-Object -First 1
          if ( $null -eq $Installer -or $Installer.Length -le 0 ) {
            throw 'Windows installer was not created.'
          }

          $ObsRoot = Join-Path $env:RUNNER_TEMP 'obs-studio'
          New-Item -ItemType Directory -Force -Path (Join-Path $ObsRoot 'bin/64bit') | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $ObsRoot 'bin/64bit/obs64.exe') | Out-Null

          $InstallerProcess = Start-Process -FilePath $Installer.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"${ObsRoot}`"") `
            -Wait -PassThru
          if ( $InstallerProcess.ExitCode -ne 0 ) {
            throw "Installer exited with code $($InstallerProcess.ExitCode)."
          }

          $PluginDll = Join-Path $ObsRoot 'obs-plugins/64bit/smart-chroma-key.dll'
          $PluginEffect = Join-Path $env:ProgramData 'obs-studio/plugins/smart-chroma-key/data/smart-chroma-key.effect'
          if ( ! ( Test-Path $PluginDll ) -or ! ( Test-Path $PluginEffect ) ) {
            throw 'Installed plugin payload is incomplete.'
          }

          $Uninstaller = Get-Item (Join-Path $ObsRoot 'unins*.exe') | Select-Object -First 1
          $UninstallerProcess = Start-Process -FilePath $Uninstaller.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
            -Wait -PassThru
          if ( $UninstallerProcess.ExitCode -ne 0 ) {
            throw "Uninstaller exited with code $($UninstallerProcess.ExitCode)."
          }
          if ( ( Test-Path $PluginDll ) -or ( Test-Path $PluginEffect ) ) {
            throw 'Uninstaller left plugin files behind.'
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-chroma-key-windows
          path: |
            release/*.zip
            release/*-installer.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            smart-chroma-key-macos/smart-chroma-key-macos.zip
            smart-chroma-key-macos/*.pkg
            smart-chroma-key-windows/*.zip
            smart-chroma-key-windows/*-installer.exe
          generate_release_notes: true
